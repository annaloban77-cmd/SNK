version: '3.8'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - ocr-service
    environment:
      - OCR_SIDECAR_URL=http://ocr-service:8100

  ocr-service:
    build: ./ocr-service
    ports:
      - "8100:8100"
    volumes:
      - paddle_cache:/tmp/paddle

volumes:
  paddle_cache:
