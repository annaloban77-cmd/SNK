<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="PT Sans, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="g6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="g7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f8fafc"/>

  <!-- Title -->
  <text x="600" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">Архитектура потока данных — НК-Контроль</text>
  <text x="600" y="62" font-size="13" text-anchor="middle" fill="#64748b">Скан/CAD → OCR → Геометрия → Правила → Post-filter → LLM → Замечания</text>

  <!-- Layer 1: Sources -->
  <g>
    <rect x="60" y="100" width="280" height="80" rx="8" fill="url(#g1)" stroke="#1e3a8a" stroke-width="2"/>
    <text x="200" y="130" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Скан / PDF / PNG</text>
    <text x="200" y="155" font-size="11" text-anchor="middle" fill="#bfdbfe">JPG · PDF · PNG · TIFF</text>

    <rect x="460" y="100" width="280" height="80" rx="8" fill="url(#g1)" stroke="#1e3a8a" stroke-width="2"/>
    <text x="600" y="130" font-size="15" font-weight="bold" text-anchor="middle" fill="white">CAD-файлы</text>
    <text x="600" y="155" font-size="11" text-anchor="middle" fill="#bfdbfe">DWG · DXF · CDW · SLDPRT/ASM/DRW · SPW</text>

    <rect x="860" y="100" width="280" height="80" rx="8" fill="url(#g1)" stroke="#1e3a8a" stroke-width="2"/>
    <text x="1000" y="130" font-size="15" font-weight="bold" text-anchor="middle" fill="white">SVG (бенч)</text>
    <text x="1000" y="155" font-size="11" text-anchor="middle" fill="#bfdbfe">Эталонные чертежи с известными ошибками</text>
  </g>

  <!-- Arrows Layer 1 → Layer 2 -->
  <path d="M 200 180 L 200 220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M 600 180 L 600 220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M 1000 180 L 1000 220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Layer 2: OCR / CAD parser -->
  <g>
    <rect x="60" y="220" width="1080" height="100" rx="8" fill="url(#g2)" stroke="#065f46" stroke-width="2"/>
    <text x="600" y="248" font-size="16" font-weight="bold" text-anchor="middle" fill="white">OCR / CAD-парсер</text>
    <text x="600" y="270" font-size="11" text-anchor="middle" fill="#bbf7d0">SVG-парсер → PaddleOCR (:8100) → Tesseract → VLM (last-resort, conf &lt; 0.4)</text>
    <text x="600" y="290" font-size="11" text-anchor="middle" fill="#bbf7d0">DXF: ATTDEF + TEXT · DWG: UTF-16LE · CDW/SPW: свойства файла</text>
    <text x="600" y="308" font-size="10" text-anchor="middle" fill="#a7f3d0" font-style="italic">Извлечённый штамп: designation · name · scale · mass · material · signatures · ГОСТ-перечень</text>
  </g>

  <!-- Arrow Layer 2 → Layer 3 -->
  <path d="M 600 320 L 600 360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Layer 3: Rules engine -->
  <g>
    <rect x="60" y="360" width="1080" height="90" rx="8" fill="url(#g3)" stroke="#7c2d12" stroke-width="2"/>
    <text x="600" y="388" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Движок правил (460 правил)</text>
    <text x="600" y="410" font-size="11" text-anchor="middle" fill="#fed7aa">deterministic (точное совпадение) · semantic (смысловой) · vision (геометрия)</text>
    <text x="600" y="430" font-size="11" text-anchor="middle" fill="#fed7aa">Категории: stamp · material · welding · format · tolerances · specification · shipbuilding</text>
  </g>

  <!-- Arrow Layer 3 → Layer 4 -->
  <path d="M 600 450 L 600 490" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Layer 4: Post-filter -->
  <g>
    <rect x="60" y="490" width="1080" height="80" rx="8" fill="url(#g4)" stroke="#581c87" stroke-width="2"/>
    <text x="600" y="518" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Post-filter</text>
    <text x="600" y="540" font-size="11" text-anchor="middle" fill="#e9d5ff">confidence-aware · dedupe (правило+поле) · drop-low (conf &lt; 0.4) · validate OCR-артефакты</text>
    <text x="600" y="558" font-size="10" text-anchor="middle" fill="#d8b4fe" font-style="italic">→ отфильтрованные findings</text>
  </g>

  <!-- Arrow Layer 4 → Layer 5 -->
  <path d="M 600 570 L 600 610" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Layer 5: LLM-семантика -->
  <g>
    <rect x="60" y="610" width="1080" height="80" rx="8" fill="url(#g5)" stroke="#713f12" stroke-width="2"/>
    <text x="600" y="638" font-size="16" font-weight="bold" text-anchor="middle" fill="white">LLM-семантика (опционально)</text>
    <text x="600" y="660" font-size="11" text-anchor="middle" fill="#fef3c7">Противоречия · гипотезы с evidence · согласованность штампа и спецификации · контроль сварки</text>
    <text x="600" y="678" font-size="10" text-anchor="middle" fill="#fde68a" font-style="italic">P5: LLM — только семантика, не детекция. Каждое замечание имеет source=llm.</text>
  </g>

  <!-- Arrow Layer 5 → Layer 6 -->
  <path d="M 600 690 L 600 730" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Layer 6: Issues + Feedback -->
  <g>
    <rect x="60" y="730" width="700" height="90" rx="8" fill="url(#g7)" stroke="#134e4a" stroke-width="2"/>
    <text x="410" y="758" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Замечания</text>
    <text x="410" y="780" font-size="11" text-anchor="middle" fill="#a7f3d0">Трассировка: Issue → Rule → Standard → StandardClause (P6: каждое замечание объяснимо)</text>
    <text x="410" y="800" font-size="11" text-anchor="middle" fill="#a7f3d0">Статусы: new → confirmed / rejected / fixed (P7: человек принимает решение)</text>

    <rect x="800" y="730" width="340" height="90" rx="8" fill="url(#g6)" stroke="#831843" stroke-width="2"/>
    <text x="970" y="758" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Feedback loop → Бенч</text>
    <text x="970" y="780" font-size="11" text-anchor="middle" fill="#fbcfe8">Отклонённый FP → KnowledgeSuggestion</text>
    <text x="970" y="800" font-size="11" text-anchor="middle" fill="#fbcfe8">→ тестовый эталон → правило не повторяет ошибку</text>
  </g>

  <!-- Loop arrow from Issues to Rules (showing feedback) -->
  <path d="M 1140 770 Q 1180 500 1140 405" stroke="#9d174d" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)" fill="none"/>
  <text x="1175" y="540" font-size="10" fill="#9d174d" font-style="italic" transform="rotate(-90 1175 540)">feedback</text>

  <!-- Side annotations -->
  <g>
    <rect x="60" y="850" width="280" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="200" y="870" font-size="11" text-anchor="middle" fill="#0c4a6e">P1: Знания — в данных (БД), не в весах</text>

    <rect x="460" y="850" width="280" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="600" y="870" font-size="11" text-anchor="middle" fill="#0c4a6e">P4: Стенд — предохранитель релиза</text>

    <rect x="860" y="850" width="280" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="1000" y="870" font-size="11" text-anchor="middle" fill="#0c4a6e">P7: Человек принимает решение</text>
  </g>
</svg>
