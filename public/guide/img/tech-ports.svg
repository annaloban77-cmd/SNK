<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="PT Sans, Helvetica Neue, Arial, sans-serif">
  <defs>
    <linearGradient id="port1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="port2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="port3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="port4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="500" fill="#f8fafc"/>

  <text x="600" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#0f172a">Порты и службы — НК-Контроль</text>
  <text x="600" y="62" font-size="13" text-anchor="middle" fill="#64748b">Один серверный процесс (server.js) слушает два порта · SQLite — единый файл</text>

  <!-- Port 1: Main site (1111) -->
  <g>
    <rect x="50" y="100" width="260" height="240" rx="12" fill="url(#port1)" stroke="#1e3a8a" stroke-width="2"/>
    <text x="180" y="135" font-size="36" font-weight="bold" text-anchor="middle" fill="white">1111</text>
    <text x="180" y="160" font-size="13" font-weight="bold" text-anchor="middle" fill="#bfdbfe">Основной сайт</text>
    <line x1="80" y1="180" x2="280" y2="180" stroke="#3b82f6" stroke-width="1"/>
    <text x="180" y="205" font-size="12" text-anchor="middle" fill="white">Рабочий сайт нормоконтролёра</text>
    <text x="180" y="230" font-size="11" text-anchor="middle" fill="#bfdbfe">· Дашборд</text>
    <text x="180" y="250" font-size="11" text-anchor="middle" fill="#bfdbfe">· Документы и замечания</text>
    <text x="180" y="270" font-size="11" text-anchor="middle" fill="#bfdbfe">· База знаний</text>
    <text x="180" y="290" font-size="11" text-anchor="middle" fill="#bfdbfe">· Правила (просмотр)</text>
    <text x="180" y="310" font-size="11" text-anchor="middle" fill="#bfdbfe">· Отчёты</text>
    <text x="180" y="328" font-size="10" text-anchor="middle" fill="#93c5fd" font-style="italic">Доступ: вся сеть предприятия</text>
  </g>

  <!-- Port 2: Admin console (3333) -->
  <g>
    <rect x="350" y="100" width="260" height="240" rx="12" fill="url(#port2)" stroke="#6b21a8" stroke-width="2"/>
    <text x="480" y="135" font-size="36" font-weight="bold" text-anchor="middle" fill="white">3333</text>
    <text x="480" y="160" font-size="13" font-weight="bold" text-anchor="middle" fill="#e9d5ff">Инженерная консоль</text>
    <line x1="380" y1="180" x2="580" y2="180" stroke="#a855f7" stroke-width="1"/>
    <text x="480" y="205" font-size="12" text-anchor="middle" fill="white">Конфигурация системы («Матрица»)</text>
    <text x="480" y="230" font-size="11" text-anchor="middle" fill="#e9d5ff">· Система / health</text>
    <text x="480" y="250" font-size="11" text-anchor="middle" fill="#e9d5ff">· OCR-движок</text>
    <text x="480" y="270" font-size="11" text-anchor="middle" fill="#e9d5ff">· LLM-модели (cloud/ollama)</text>
    <text x="480" y="290" font-size="11" text-anchor="middle" fill="#e9d5ff">· Стенд (запуск тестов)</text>
    <text x="480" y="310" font-size="11" text-anchor="middle" fill="#e9d5ff">· Config YAML</text>
    <text x="480" y="328" font-size="10" text-anchor="middle" fill="#c4b5fd" font-style="italic">Доступ: только админ</text>
  </g>

  <!-- Port 3: OCR sidecar (8100) -->
  <g>
    <rect x="650" y="100" width="260" height="240" rx="12" fill="url(#port3)" stroke="#9a3412" stroke-width="2"/>
    <text x="780" y="135" font-size="36" font-weight="bold" text-anchor="middle" fill="white">8100</text>
    <text x="780" y="160" font-size="13" font-weight="bold" text-anchor="middle" fill="#fed7aa">OCR sidecar</text>
    <line x1="680" y1="180" x2="880" y2="180" stroke="#f97316" stroke-width="1"/>
    <text x="780" y="205" font-size="12" text-anchor="middle" fill="white">PaddleOCR FastAPI</text>
    <text x="780" y="230" font-size="11" text-anchor="middle" fill="#fed7aa">· PP-OCRv5 (детекция+распознавание)</text>
    <text x="780" y="250" font-size="11" text-anchor="middle" fill="#fed7aa">· /health — статус модели</text>
    <text x="780" y="270" font-size="11" text-anchor="middle" fill="#fed7aa">· /ocr — POST image → JSON</text>
    <text x="780" y="290" font-size="11" text-anchor="middle" fill="#fed7aa">· Требует 8+ ГБ RAM</text>
    <text x="780" y="310" font-size="11" text-anchor="middle" fill="#fed7aa">· Fallback: Tesseract</text>
    <text x="780" y="328" font-size="10" text-anchor="middle" fill="#fdba74" font-style="italic">Доступ: только localhost</text>
  </g>

  <!-- Port 4: SQLite -->
  <g>
    <rect x="950" y="100" width="200" height="240" rx="12" fill="url(#port4)" stroke="#0f766e" stroke-width="2"/>
    <text x="1050" y="135" font-size="20" font-weight="bold" text-anchor="middle" fill="white">SQLite</text>
    <text x="1050" y="160" font-size="13" font-weight="bold" text-anchor="middle" fill="#a7f3d0">db/custom.db</text>
    <line x1="980" y1="180" x2="1120" y2="180" stroke="#14b8a6" stroke-width="1"/>
    <text x="1050" y="205" font-size="11" text-anchor="middle" fill="white">Единый файл</text>
    <text x="1050" y="230" font-size="11" text-anchor="middle" fill="#a7f3d0">· 20+ моделей Prisma</text>
    <text x="1050" y="250" font-size="11" text-anchor="middle" fill="#a7f3d0">· 573 стандарта</text>
    <text x="1050" y="270" font-size="11" text-anchor="middle" fill="#a7f3d0">· 460 правил</text>
    <text x="1050" y="290" font-size="11" text-anchor="middle" fill="#a7f3d0">· 4403 справочника</text>
    <text x="1050" y="310" font-size="11" text-anchor="middle" fill="#a7f3d0">· 150 тестов</text>
    <text x="1050" y="328" font-size="10" text-anchor="middle" fill="#5eead4" font-style="italic">Backup: копия файла</text>
  </g>

  <!-- Arrows between ports -->
  <line x1="310" y1="220" x2="350" y2="220" stroke="#475569" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="610" y1="220" x2="650" y2="220" stroke="#475569" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="910" y1="220" x2="950" y2="220" stroke="#475569" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Bottom legend -->
  <g>
    <rect x="50" y="380" width="1100" height="90" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="600" y="408" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Конфигурация</text>
    <text x="600" y="430" font-size="11" text-anchor="middle" fill="#475569">Порты настраиваются в <tspan font-family="monospace" fill="#0c4a6e">config.yaml</tspan> или переменных окружения <tspan font-family="monospace" fill="#0c4a6e">PORT_MAIN</tspan> / <tspan font-family="monospace" fill="#0c4a6e">PORT_ADMIN</tspan></text>
    <text x="600" y="450" font-size="11" text-anchor="middle" fill="#475569">Запуск: <tspan font-family="monospace" fill="#0c4a6e">bun server.js</tspan> (два порта) или <tspan font-family="monospace" fill="#0c4a6e">docker compose up -d</tspan></text>
  </g>
</svg>
